services:
  - type: web
    runtime: static
    name: crm
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      # Entrega o index para rotas do React Router, como /leads e /pipeline.
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      # Valores públicos, incorporados pelo Vite durante o build. Configure-os
      # no painel do Render ao criar/sincronizar este Blueprint.
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
      # Opcional: mantenha true apenas para uma demonstração sem Supabase.
      - key: VITE_DEMO_MODE
        value: "false"
